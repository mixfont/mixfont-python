[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixfont"
version = "0.1.0"
description = "Official Python client for the Mixfont API."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mixfont" }]
keywords = ["mixfont", "font", "generation", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mixfont/mixfont-python"
Repository = "https://github.com/mixfont/mixfont-python"
Issues = "https://github.com/mixfont/mixfont-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mixfont = ["py.typed"]
